<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#374151;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4b5563;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#374151;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D9FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7B2FF7;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="250" height="800" fill="rgba(55, 65, 81, 0.5)" stroke="rgba(123, 47, 247, 0.2)" stroke-width="1"/>

  <!-- Logo -->
  <text x="125" y="50" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">FourBolt</text>

  <!-- Nav Items -->
  <g id="nav-record" transform="translate(25, 100)">
    <rect width="200" height="50" rx="8" fill="rgba(255, 255, 255, 0.05)"/>
    <circle cx="25" cy="25" r="8" fill="rgba(255, 255, 255, 0.6)"/>
    <text x="50" y="30" font-family="Arial, sans-serif" font-size="14" fill="rgba(255, 255, 255, 0.7)">Record</text>
  </g>

  <g id="nav-recordings" transform="translate(25, 160)">
    <rect width="200" height="50" rx="8" fill="rgba(255, 255, 255, 0.05)"/>
    <rect x="15" y="15" width="20" height="20" rx="2" fill="rgba(255, 255, 255, 0.6)" stroke="none"/>
    <text x="50" y="30" font-family="Arial, sans-serif" font-size="14" fill="rgba(255, 255, 255, 0.7)">Recordings</text>
  </g>

  <g id="nav-action-items" transform="translate(25, 220)">
    <rect width="200" height="50" rx="8" fill="url(#primary)" opacity="0.9"/>
    <rect x="17" y="17" width="16" height="16" rx="2" fill="white" stroke="none"/>
    <polyline points="20,25 23,28 29,22" fill="none" stroke="#374151" stroke-width="2"/>
    <text x="50" y="30" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="white">Action Items</text>
  </g>

  <g id="nav-settings" transform="translate(25, 280)">
    <rect width="200" height="50" rx="8" fill="rgba(255, 255, 255, 0.05)"/>
    <circle cx="25" cy="25" r="8" fill="none" stroke="rgba(255, 255, 255, 0.6)" stroke-width="2"/>
    <text x="50" y="30" font-family="Arial, sans-serif" font-size="14" fill="rgba(255, 255, 255, 0.7)">Settings</text>
  </g>

  <!-- Main Content Area -->
  <g transform="translate(300, 30)">
    <!-- Header -->
    <text x="0" y="35" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white">Action Items</text>

    <!-- Statistics Cards -->
    <g transform="translate(0, 60)">
      <!-- Total Card -->
      <rect x="0" y="0" width="200" height="100" rx="12" fill="rgba(55, 65, 81, 0.5)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <rect x="15" y="15" width="16" height="16" rx="2" fill="none" stroke="#00D9FF" stroke-width="2"/>
      <text x="15" y="50" font-family="Arial, sans-serif" font-size="11" fill="rgba(255, 255, 255, 0.6)">Total</text>
      <text x="15" y="80" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white">15</text>

      <!-- Completed Card -->
      <rect x="215" y="0" width="200" height="100" rx="12" fill="rgba(55, 65, 81, 0.5)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <rect x="230" y="15" width="16" height="16" rx="2" fill="#22c55e" stroke="none"/>
      <polyline points="233,23 236,26 242,20" fill="none" stroke="white" stroke-width="2"/>
      <text x="230" y="50" font-family="Arial, sans-serif" font-size="11" fill="rgba(255, 255, 255, 0.6)">Completed</text>
      <text x="230" y="80" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#22c55e">8</text>

      <!-- Pending Card -->
      <rect x="430" y="0" width="200" height="100" rx="12" fill="rgba(55, 65, 81, 0.5)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <circle cx="453" cy="23" r="8" fill="none" stroke="#f59e0b" stroke-width="2"/>
      <text x="445" y="50" font-family="Arial, sans-serif" font-size="11" fill="rgba(255, 255, 255, 0.6)">Pending</text>
      <text x="445" y="80" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#f59e0b">5</text>

      <!-- Overdue Card -->
      <rect x="645" y="0" width="200" height="100" rx="12" fill="rgba(55, 65, 81, 0.5)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <path d="M 668 20 L 668 30 M 668 20 L 672 24" fill="none" stroke="#ef4444" stroke-width="2"/>
      <text x="660" y="50" font-family="Arial, sans-serif" font-size="11" fill="rgba(255, 255, 255, 0.6)">Overdue</text>
      <text x="660" y="80" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#ef4444">2</text>
    </g>

    <!-- Filters and Search -->
    <g transform="translate(0, 180)">
      <text x="0" y="20" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="white">Filter & Sort</text>

      <!-- Filter Buttons -->
      <g transform="translate(0, 30)">
        <rect x="0" y="0" width="80" height="35" rx="6" fill="url(#primary)"/>
        <text x="40" y="22" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="white" text-anchor="middle">All</text>

        <rect x="90" y="0" width="80" height="35" rx="6" fill="rgba(0, 0, 0, 0.2)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
        <text x="130" y="22" font-family="Arial, sans-serif" font-size="12" fill="rgba(255, 255, 255, 0.7)" text-anchor="middle">Active</text>

        <rect x="180" y="0" width="110" height="35" rx="6" fill="rgba(0, 0, 0, 0.2)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
        <text x="235" y="22" font-family="Arial, sans-serif" font-size="12" fill="rgba(255, 255, 255, 0.7)" text-anchor="middle">Completed</text>

        <rect x="300" y="0" width="90" height="35" rx="6" fill="rgba(0, 0, 0, 0.2)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
        <text x="345" y="22" font-family="Arial, sans-serif" font-size="12" fill="rgba(255, 255, 255, 0.7)" text-anchor="middle">Overdue</text>
      </g>

      <!-- Sort Dropdown -->
      <rect x="600" y="30" width="245" height="35" rx="6" fill="rgba(0, 0, 0, 0.2)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <text x="615" y="52" font-family="Arial, sans-serif" font-size="12" fill="rgba(255, 255, 255, 0.7)">Sort: Most Recent</text>
    </g>

    <!-- Action Items List -->
    <g transform="translate(0, 270)">
      <!-- Item 1 -->
      <rect x="0" y="0" width="845" height="85" rx="12" fill="rgba(55, 65, 81, 0.5)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <rect x="15" y="15" width="20" height="20" rx="4" fill="none" stroke="rgba(255, 255, 255, 0.6)" stroke-width="2"/>
      <text x="50" y="30" font-family="Arial, sans-serif" font-size="14" fill="white">Prepare product demonstration materials</text>
      <text x="50" y="50" font-family="Arial, sans-serif" font-size="11" fill="rgba(255, 255, 255, 0.5)">Jennifer Liu</text>
      <text x="160" y="50" font-family="Arial, sans-serif" font-size="11" fill="rgba(255, 255, 255, 0.5)">Due: 10-13-2025</text>
      <rect x="50" y="58" width="50" height="18" rx="4" fill="rgba(239, 68, 68, 0.2)"/>
      <text x="75" y="70" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#ef4444" text-anchor="middle">high</text>

      <!-- Item 2 -->
      <rect x="0" y="100" width="845" height="85" rx="12" fill="rgba(55, 65, 81, 0.5)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <rect x="15" y="115" width="20" height="20" rx="4" fill="none" stroke="rgba(255, 255, 255, 0.6)" stroke-width="2"/>
      <text x="50" y="130" font-family="Arial, sans-serif" font-size="14" fill="white">Follow up with client on equipment specifications</text>
      <text x="50" y="150" font-family="Arial, sans-serif" font-size="11" fill="rgba(255, 255, 255, 0.5)">Mike Ross</text>
      <text x="130" y="150" font-family="Arial, sans-serif" font-size="11" fill="rgba(255, 255, 255, 0.5)">Due: 10-15-2025</text>
      <rect x="50" y="158" width="50" height="18" rx="4" fill="rgba(239, 68, 68, 0.2)"/>
      <text x="75" y="170" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#ef4444" text-anchor="middle">high</text>

      <!-- Item 3 (Completed) -->
      <rect x="0" y="200" width="845" height="85" rx="12" fill="rgba(55, 65, 81, 0.5)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <rect x="15" y="215" width="20" height="20" rx="4" fill="#22c55e" stroke="none"/>
      <polyline points="20,225 24,229 31,222" fill="none" stroke="white" stroke-width="2"/>
      <text x="50" y="230" font-family="Arial, sans-serif" font-size="14" fill="rgba(255, 255, 255, 0.4)" text-decoration="line-through">Send contract proposal by Friday</text>
      <text x="50" y="250" font-family="Arial, sans-serif" font-size="11" fill="rgba(255, 255, 255, 0.3)">Mike Ross</text>
      <text x="130" y="250" font-family="Arial, sans-serif" font-size="11" fill="rgba(255, 255, 255, 0.3)">Due: 10-05-2025</text>
      <rect x="50" y="258" width="60" height="18" rx="4" fill="rgba(34, 197, 94, 0.2)"/>
      <text x="80" y="270" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#22c55e" text-anchor="middle">medium</text>

      <!-- Item 4 -->
      <rect x="0" y="300" width="845" height="85" rx="12" fill="rgba(55, 65, 81, 0.5)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <rect x="15" y="315" width="20" height="20" rx="4" fill="none" stroke="rgba(255, 255, 255, 0.6)" stroke-width="2"/>
      <text x="50" y="330" font-family="Arial, sans-serif" font-size="14" fill="white">Complete certification for all operators</text>
      <text x="50" y="350" font-family="Arial, sans-serif" font-size="11" fill="rgba(255, 255, 255, 0.5)">Jennifer Liu</text>
      <text x="160" y="350" font-family="Arial, sans-serif" font-size="11" fill="rgba(255, 255, 255, 0.5)">Due: 10-18-2025</text>
      <rect x="50" y="358" width="50" height="18" rx="4" fill="rgba(239, 68, 68, 0.2)"/>
      <text x="75" y="370" font-family="Arial, sans-serif" font-size="10" font-weight="600" fill="#ef4444" text-anchor="middle">high</text>
    </g>
  </g>
</svg>