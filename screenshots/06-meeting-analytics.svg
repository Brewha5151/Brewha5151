<svg width="1400" height="900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#374151;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4b5563;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#374151;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D9FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7B2FF7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bar1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D9FF;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#00D9FF;stop-opacity:0.5" />
    </linearGradient>
    <linearGradient id="bar2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7B2FF7;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#7B2FF7;stop-opacity:0.5" />
    </linearGradient>
    <linearGradient id="bar3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:0.5" />
    </linearGradient>
  </defs>

  <rect width="1400" height="900" fill="url(#bg)"/>

  <!-- Top Navigation -->
  <rect x="0" y="0" width="1400" height="70" fill="rgba(0, 0, 0, 0.3)"/>
  <text x="30" y="45" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white">FourBolt</text>

  <!-- Left Sidebar - Recording Vault -->
  <rect x="0" y="70" width="320" height="830" fill="rgba(0, 0, 0, 0.2)"/>
  <text x="20" y="110" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="white">Recording Vault</text>

  <!-- Meetings List -->
  <g transform="translate(20, 130)">
    <rect x="0" y="0" width="280" height="90" rx="8" fill="rgba(123, 47, 247, 0.2)" stroke="#7B2FF7" stroke-width="2"/>
    <text x="15" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="white">Team Standup</text>
    <text x="15" y="45" font-family="Arial, sans-serif" font-size="11" fill="rgba(255, 255, 255, 0.5)">Nov 14, 2025 • 10:30 AM</text>
    <text x="15" y="65" font-family="Arial, sans-serif" font-size="11" fill="rgba(255, 255, 255, 0.5)">Duration: 12:45 • 3 speakers</text>
  </g>

  <!-- Main Content Area -->
  <g transform="translate(360, 100)">
    <rect x="0" y="0" width="1000" height="760" rx="12" fill="rgba(55, 65, 81, 0.3)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>

    <!-- Meeting Header -->
    <g transform="translate(40, 40)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white">Team Standup</text>
      <text x="0" y="28" font-family="Arial, sans-serif" font-size="13" fill="rgba(255, 255, 255, 0.6)">Nov 14, 2025 at 10:30 AM • Duration: 12:45 • 3 speakers</text>
    </g>

    <!-- Tab Bar -->
    <g transform="translate(40, 100)">
      <!-- Transcript Tab -->
      <rect x="0" y="0" width="140" height="48" rx="8" fill="rgba(255, 255, 255, 0.05)"/>
      <text x="70" y="30" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="rgba(255, 255, 255, 0.6)" text-anchor="middle">Transcript</text>

      <!-- Summary Tab -->
      <rect x="150" y="0" width="140" height="48" rx="8" fill="rgba(255, 255, 255, 0.05)"/>
      <text x="220" y="30" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="rgba(255, 255, 255, 0.6)" text-anchor="middle">Summary</text>

      <!-- Analytics Tab (Active) -->
      <rect x="300" y="0" width="140" height="48" rx="8" fill="url(#primary)" opacity="0.9"/>
      <text x="370" y="30" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle">Analytics</text>
    </g>

    <!-- Analytics Content -->
    <g transform="translate(40, 180)">
      <!-- Statistics Cards -->
      <g>
        <!-- Total Words Card -->
        <rect x="0" y="0" width="280" height="100" rx="12" fill="rgba(0, 217, 255, 0.1)" stroke="rgba(0, 217, 255, 0.3)" stroke-width="1"/>
        <text x="20" y="35" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#00D9FF">1,247</text>
        <text x="20" y="60" font-family="Arial, sans-serif" font-size="13" fill="rgba(255, 255, 255, 0.6)">Total Words Spoken</text>

        <!-- Duration Card -->
        <rect x="300" y="0" width="280" height="100" rx="12" fill="rgba(123, 47, 247, 0.1)" stroke="rgba(123, 47, 247, 0.3)" stroke-width="1"/>
        <text x="320" y="35" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#7B2FF7">12:45</text>
        <text x="320" y="60" font-family="Arial, sans-serif" font-size="13" fill="rgba(255, 255, 255, 0.6)">Meeting Duration</text>

        <!-- Speakers Card -->
        <rect x="600" y="0" width="280" height="100" rx="12" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
        <text x="620" y="35" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#10B981">3</text>
        <text x="620" y="60" font-family="Arial, sans-serif" font-size="13" fill="rgba(255, 255, 255, 0.6)">Total Speakers</text>
      </g>

      <!-- Speaking Time Analysis -->
      <g transform="translate(0, 140)">
        <rect x="0" y="0" width="920" height="430" rx="12" fill="rgba(0, 0, 0, 0.2)"/>

        <text x="20" y="35" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="white">📊 Speaking Time Distribution</text>

        <!-- Speaker 1 Bar -->
        <g transform="translate(20, 70)">
          <rect x="0" y="0" width="880" height="100" rx="8" fill="rgba(0, 0, 0, 0.2)"/>

          <!-- Speaker Info -->
          <rect x="20" y="20" width="120" height="28" rx="14" fill="rgba(0, 217, 255, 0.2)"/>
          <text x="80" y="39" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#00D9FF" text-anchor="middle">Speaker 1</text>

          <!-- Progress Bar -->
          <rect x="160" y="20" width="680" height="28" rx="14" fill="rgba(255, 255, 255, 0.05)"/>
          <rect x="160" y="20" width="408" height="28" rx="14" fill="url(#bar1)"/>

          <!-- Stats -->
          <text x="20" y="73" font-family="Arial, sans-serif" font-size="12" fill="rgba(255, 255, 255, 0.6)">Speaking time: 5:25</text>
          <text x="160" y="73" font-family="Arial, sans-serif" font-size="12" fill="rgba(255, 255, 255, 0.6)">Words: 524</text>
          <text x="800" y="39" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#00D9FF">42%</text>
        </g>

        <!-- Speaker 2 Bar -->
        <g transform="translate(20, 190)">
          <rect x="0" y="0" width="880" height="100" rx="8" fill="rgba(0, 0, 0, 0.2)"/>

          <rect x="20" y="20" width="120" height="28" rx="14" fill="rgba(123, 47, 247, 0.2)"/>
          <text x="80" y="39" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#7B2FF7" text-anchor="middle">Speaker 2</text>

          <rect x="160" y="20" width="680" height="28" rx="14" fill="rgba(255, 255, 255, 0.05)"/>
          <rect x="160" y="20" width="340" height="28" rx="14" fill="url(#bar2)"/>

          <text x="20" y="73" font-family="Arial, sans-serif" font-size="12" fill="rgba(255, 255, 255, 0.6)">Speaking time: 4:30</text>
          <text x="160" y="73" font-family="Arial, sans-serif" font-size="12" fill="rgba(255, 255, 255, 0.6)">Words: 438</text>
          <text x="800" y="39" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#7B2FF7">35%</text>
        </g>

        <!-- Speaker 3 Bar -->
        <g transform="translate(20, 310)">
          <rect x="0" y="0" width="880" height="100" rx="8" fill="rgba(0, 0, 0, 0.2)"/>

          <rect x="20" y="20" width="120" height="28" rx="14" fill="rgba(16, 185, 129, 0.2)"/>
          <text x="80" y="39" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#10B981" text-anchor="middle">Speaker 3</text>

          <rect x="160" y="20" width="680" height="28" rx="14" fill="rgba(255, 255, 255, 0.05)"/>
          <rect x="160" y="20" width="224" height="28" rx="14" fill="url(#bar3)"/>

          <text x="20" y="73" font-family="Arial, sans-serif" font-size="12" fill="rgba(255, 255, 255, 0.6)">Speaking time: 2:50</text>
          <text x="160" y="73" font-family="Arial, sans-serif" font-size="12" fill="rgba(255, 255, 255, 0.6)">Words: 285</text>
          <text x="800" y="39" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#10B981">23%</text>
        </g>
      </g>
    </g>
  </g>
</svg>
