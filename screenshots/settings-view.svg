<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#ffffff"/>

  <!-- Sidebar -->
  <rect width="200" height="800" fill="#f5f5f7"/>
  <line x1="200" y1="0" x2="200" y2="800" stroke="#d2d2d7" stroke-width="1"/>

  <!-- Sidebar Header -->
  <text x="20" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#1d1d1f">FourBolt</text>
  <line x1="20" y1="60" x2="180" y2="60" stroke="#d2d2d7" stroke-width="1"/>

  <!-- Sidebar Nav - Record -->
  <circle cx="28" cy="102" r="8" stroke="#1d1d1f" stroke-width="2" fill="none"/>
  <text x="50" y="107" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#1d1d1f">Record</text>

  <!-- Sidebar Nav - History -->
  <rect x="20" y="136" width="14" height="14" stroke="#1d1d1f" stroke-width="1.5" fill="none" rx="2"/>
  <text x="50" y="147" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#1d1d1f">History</text>

  <!-- Sidebar Nav - Settings (Active) -->
  <rect x="0" y="164" width="200" height="44" fill="#007aff"/>
  <circle cx="28" cy="186" r="8" stroke="#ffffff" stroke-width="1.5" fill="none"/>
  <circle cx="28" cy="186" r="3" fill="#ffffff"/>
  <text x="50" y="191" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#ffffff">Settings</text>

  <!-- Main Content Header -->
  <text x="240" y="60" font-family="Arial, sans-serif" font-size="32" font-weight="600" fill="#1d1d1f">Settings</text>

  <!-- Transcription Section -->
  <text x="240" y="120" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#1d1d1f">Transcription</text>
  <line x1="240" y1="130" x2="960" y2="130" stroke="#d2d2d7" stroke-width="2"/>

  <!-- API Key Input -->
  <text x="240" y="165" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#1d1d1f">OpenAI API Key</text>
  <rect x="240" y="175" width="720" height="40" fill="#ffffff" stroke="#d2d2d7" stroke-width="1" rx="8"/>
  <text x="255" y="201" font-family="Arial, sans-serif" font-size="14" fill="#1d1d1f">••••••••••••••••••••••••••••</text>
  <text x="240" y="228" font-family="Arial, sans-serif" font-size="13" fill="#6e6e73">Required for audio transcription. Get your API key from OpenAI Platform</text>

  <!-- Default Model Selector -->
  <text x="240" y="268" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#1d1d1f">Default Model</text>
  <rect x="240" y="278" width="720" height="40" fill="#ffffff" stroke="#d2d2d7" stroke-width="1" rx="8"/>
  <text x="255" y="304" font-family="Arial, sans-serif" font-size="14" fill="#1d1d1f">Whisper-1 (Recommended)</text>
  <polygon points="940,296 945,301 950,296" fill="#1d1d1f"/>
  <text x="240" y="331" font-family="Arial, sans-serif" font-size="13" fill="#6e6e73">The AI model used for transcription</text>

  <!-- Audio Settings Section -->
  <text x="240" y="385" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#1d1d1f">Audio Settings</text>
  <line x1="240" y1="395" x2="960" y2="395" stroke="#d2d2d7" stroke-width="2"/>

  <!-- Sample Rate Selector -->
  <text x="240" y="430" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#1d1d1f">Sample Rate</text>
  <rect x="240" y="440" width="720" height="40" fill="#ffffff" stroke="#d2d2d7" stroke-width="1" rx="8"/>
  <text x="255" y="466" font-family="Arial, sans-serif" font-size="14" fill="#1d1d1f">44.1 kHz (CD quality, recommended)</text>
  <polygon points="940,458 945,463 950,458" fill="#1d1d1f"/>
  <text x="240" y="493" font-family="Arial, sans-serif" font-size="13" fill="#6e6e73">Higher sample rates provide better quality but larger file sizes</text>

  <!-- Audio Format Selector -->
  <text x="240" y="533" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#1d1d1f">Audio Format</text>
  <rect x="240" y="543" width="720" height="40" fill="#ffffff" stroke="#d2d2d7" stroke-width="1" rx="8"/>
  <text x="255" y="569" font-family="Arial, sans-serif" font-size="14" fill="#1d1d1f">WAV (Uncompressed, highest quality)</text>
  <polygon points="940,561 945,566 950,561" fill="#1d1d1f"/>

  <!-- Appearance Section -->
  <text x="240" y="638" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#1d1d1f">Appearance</text>
  <line x1="240" y1="648" x2="960" y2="648" stroke="#d2d2d7" stroke-width="2"/>

  <!-- Theme Selector -->
  <text x="240" y="683" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#1d1d1f">Theme</text>
  <rect x="240" y="693" width="720" height="40" fill="#ffffff" stroke="#d2d2d7" stroke-width="1" rx="8"/>
  <text x="255" y="719" font-family="Arial, sans-serif" font-size="14" fill="#1d1d1f">Light</text>
  <polygon points="940,711 945,716 950,711" fill="#1d1d1f"/>

  <!-- Save Button -->
  <rect x="820" y="750" width="140" height="40" fill="#007aff" rx="8"/>
  <text x="845" y="775" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#ffffff">Save Settings</text>
</svg>
