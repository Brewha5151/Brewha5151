<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#374151;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4b5563;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#374151;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D9FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7B2FF7;stop-opacity:1" />
    </linearGradient>
    <!-- Light theme gradient -->
    <linearGradient id="light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4f8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#e2e8f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cbd5e1;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="250" height="800" fill="rgba(55, 65, 81, 0.5)" stroke="rgba(123, 47, 247, 0.2)" stroke-width="1"/>

  <!-- Logo -->
  <text x="125" y="50" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">FourBolt</text>

  <!-- Nav Items -->
  <g id="nav-record" transform="translate(25, 100)">
    <rect width="200" height="50" rx="8" fill="rgba(255, 255, 255, 0.05)"/>
    <circle cx="25" cy="25" r="8" fill="rgba(255, 255, 255, 0.6)"/>
    <text x="50" y="30" font-family="Arial, sans-serif" font-size="14" fill="rgba(255, 255, 255, 0.7)">Record</text>
  </g>

  <g id="nav-recordings" transform="translate(25, 160)">
    <rect width="200" height="50" rx="8" fill="rgba(255, 255, 255, 0.05)"/>
    <rect x="15" y="15" width="20" height="20" rx="2" fill="rgba(255, 255, 255, 0.6)" stroke="none"/>
    <text x="50" y="30" font-family="Arial, sans-serif" font-size="14" fill="rgba(255, 255, 255, 0.7)">Recordings</text>
  </g>

  <g id="nav-action-items" transform="translate(25, 220)">
    <rect width="200" height="50" rx="8" fill="rgba(255, 255, 255, 0.05)"/>
    <rect x="17" y="17" width="16" height="16" rx="2" fill="none" stroke="rgba(255, 255, 255, 0.6)" stroke-width="2"/>
    <text x="50" y="30" font-family="Arial, sans-serif" font-size="14" fill="rgba(255, 255, 255, 0.7)">Action Items</text>
  </g>

  <g id="nav-settings" transform="translate(25, 280)">
    <rect width="200" height="50" rx="8" fill="url(#primary)" opacity="0.9"/>
    <circle cx="25" cy="25" r="8" fill="white"/>
    <circle cx="25" cy="25" r="3" fill="#374151"/>
    <text x="50" y="30" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="white">Settings</text>
  </g>

  <!-- Main Content Area -->
  <g transform="translate(300, 30)">
    <!-- Header -->
    <text x="0" y="35" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white">Settings</text>

    <!-- Color Palette Section -->
    <g transform="translate(0, 80)">
      <rect x="0" y="0" width="850" height="200" rx="12" fill="rgba(55, 65, 81, 0.5)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>

      <text x="20" y="35" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="white">Color Palette</text>

      <!-- Medium Gray Theme (Selected) -->
      <g transform="translate(20, 50)">
        <rect x="0" y="0" width="190" height="120" rx="8" fill="url(#bg)" stroke="#00D9FF" stroke-width="3"/>
        <text x="95" y="70" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="white" text-anchor="middle">Medium Gray</text>
        <circle cx="95" cy="100" r="12" fill="#00D9FF"/>
        <path d="M 90 100 L 93 103 L 100 96" fill="none" stroke="white" stroke-width="2"/>
      </g>

      <!-- Light Theme -->
      <g transform="translate(220, 50)">
        <rect x="0" y="0" width="190" height="120" rx="8" fill="url(#light)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
        <text x="95" y="70" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#1e293b" text-anchor="middle">Light</text>
      </g>

      <!-- Midnight Blue Theme -->
      <g transform="translate(420, 50)">
        <rect x="0" y="0" width="190" height="120" rx="8" fill="#0f172a" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
        <text x="95" y="70" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle">Midnight Blue</text>
      </g>

      <!-- Retro 90s Theme -->
      <g transform="translate(620, 50)">
        <rect x="0" y="0" width="190" height="120" rx="8" fill="#008080" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
        <text x="95" y="70" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="white" text-anchor="middle">Retro 90s</text>
      </g>
    </g>

    <!-- AI Settings Section -->
    <g transform="translate(0, 300)">
      <rect x="0" y="0" width="420" height="250" rx="12" fill="rgba(55, 65, 81, 0.5)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>

      <circle cx="30" cy="30" r="8" fill="#00D9FF"/>
      <text x="50" y="35" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="white">AI Settings</text>

      <!-- Default AI Model -->
      <text x="20" y="75" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="rgba(255, 255, 255, 0.6)">Default AI Model</text>
      <rect x="20" y="85" width="380" height="40" rx="8" fill="rgba(0, 0, 0, 0.2)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <text x="35" y="110" font-family="Arial, sans-serif" font-size="13" fill="white">Claude Sonnet 4.5</text>

      <!-- Custom Vocabulary -->
      <text x="20" y="155" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="rgba(255, 255, 255, 0.6)">Custom Vocabulary</text>
      <rect x="20" y="165" width="380" height="60" rx="8" fill="rgba(0, 0, 0, 0.2)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <text x="35" y="188" font-family="Arial, sans-serif" font-size="12" fill="rgba(255, 255, 255, 0.5)">forklift, pallet jack, reach truck</text>
      <text x="35" y="208" font-family="Arial, sans-serif" font-size="12" fill="rgba(255, 255, 255, 0.5)">order picker</text>
    </g>

    <!-- Audio & Integration Section -->
    <g transform="translate(440, 300)">
      <rect x="0" y="0" width="410" height="160" rx="12" fill="rgba(55, 65, 81, 0.5)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>

      <circle cx="30" cy="30" r="8" fill="#7B2FF7"/>
      <text x="50" y="35" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="white">Audio & Integration</text>

      <!-- Microphone Selection -->
      <text x="20" y="75" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="rgba(255, 255, 255, 0.6)">Selected Microphone</text>
      <rect x="20" y="85" width="370" height="40" rx="8" fill="rgba(0, 0, 0, 0.2)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <text x="35" y="110" font-family="Arial, sans-serif" font-size="13" fill="white">Default</text>

      <!-- Calendar Integration Toggle -->
      <rect x="20" y="140" width="16" height="16" rx="2" fill="none" stroke="rgba(255, 255, 255, 0.6)" stroke-width="2"/>
      <text x="45" y="152" font-family="Arial, sans-serif" font-size="13" fill="white">Calendar Integration</text>
    </g>

    <!-- Statistics Section -->
    <g transform="translate(440, 480)">
      <rect x="0" y="0" width="410" height="160" rx="12" fill="rgba(55, 65, 81, 0.5)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>

      <circle cx="30" cy="30" r="8" fill="#00D9FF"/>
      <text x="50" y="35" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="white">Statistics</text>

      <!-- Stats Grid -->
      <g transform="translate(20, 60)">
        <rect x="0" y="0" width="170" height="80" rx="8" fill="rgba(0, 0, 0, 0.2)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
        <circle cx="20" cy="20" r="6" fill="#00D9FF"/>
        <text x="20" y="45" font-family="Arial, sans-serif" font-size="10" fill="rgba(255, 255, 255, 0.6)">Total Recordings</text>
        <text x="20" y="68" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white">32</text>

        <rect x="190" y="0" width="170" height="80" rx="8" fill="rgba(0, 0, 0, 0.2)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
        <circle cx="210" cy="20" r="6" fill="#7B2FF7"/>
        <text x="210" y="45" font-family="Arial, sans-serif" font-size="10" fill="rgba(255, 255, 255, 0.6)">Total Minutes</text>
        <text x="210" y="68" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white">847</text>
      </g>
    </g>
  </g>
</svg>