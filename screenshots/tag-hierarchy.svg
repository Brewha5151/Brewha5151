<svg width="240" height="500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="240" height="500" fill="#f7f7f7"/>
  <line x1="240" y1="0" x2="240" y2="500" stroke="#e0e0e0" stroke-width="1"/>

  <!-- App Title -->
  <text x="16" y="35" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#cc4444">Bear Notes</text>
  <line x1="0" y1="60" x2="240" y2="60" stroke="#e0e0e0" stroke-width="1"/>

  <!-- TAGS Header -->
  <text x="16" y="95" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#999" letter-spacing="0.5">TAGS</text>

  <!-- Tags with Hierarchy -->
  <g transform="translate(0, 110)">
    <!-- work (expanded) -->
    <rect width="240" height="40" fill="#e0e0e0"/>
    <text x="16" y="25" font-family="Arial, sans-serif" font-size="12" fill="#cc4444">▾</text>
    <text x="32" y="25" font-family="Arial, sans-serif" font-size="14" fill="#cc4444">#</text>
    <text x="44" y="25" font-family="Arial, sans-serif" font-size="14" fill="#cc4444">work</text>
    <text x="220" y="25" font-family="Arial, sans-serif" font-size="12" fill="#999" text-anchor="end">3</text>

    <!-- work/projects -->
    <g transform="translate(0, 40)">
      <text x="48" y="25" font-family="Arial, sans-serif" font-size="14" fill="#555">#</text>
      <text x="60" y="25" font-family="Arial, sans-serif" font-size="14" fill="#555">projects</text>
      <text x="220" y="25" font-family="Arial, sans-serif" font-size="12" fill="#999" text-anchor="end">1</text>
    </g>

    <!-- work/meetings -->
    <g transform="translate(0, 70)">
      <text x="48" y="25" font-family="Arial, sans-serif" font-size="14" fill="#555">#</text>
      <text x="60" y="25" font-family="Arial, sans-serif" font-size="14" fill="#555">meetings</text>
      <text x="220" y="25" font-family="Arial, sans-serif" font-size="12" fill="#999" text-anchor="end">1</text>
    </g>

    <!-- personal (expanded) -->
    <g transform="translate(0, 100)">
      <text x="16" y="25" font-family="Arial, sans-serif" font-size="12" fill="#555">▾</text>
      <text x="32" y="25" font-family="Arial, sans-serif" font-size="14" fill="#555">#</text>
      <text x="44" y="25" font-family="Arial, sans-serif" font-size="14" fill="#555">personal</text>
      <text x="220" y="25" font-family="Arial, sans-serif" font-size="12" fill="#999" text-anchor="end">3</text>
    </g>

    <!-- personal/reading -->
    <g transform="translate(0, 130)">
      <text x="48" y="25" font-family="Arial, sans-serif" font-size="14" fill="#555">#</text>
      <text x="60" y="25" font-family="Arial, sans-serif" font-size="14" fill="#555">reading</text>
      <text x="220" y="25" font-family="Arial, sans-serif" font-size="12" fill="#999" text-anchor="end">1</text>
    </g>

    <!-- personal/shopping -->
    <g transform="translate(0, 160)">
      <text x="48" y="25" font-family="Arial, sans-serif" font-size="14" fill="#555">#</text>
      <text x="60" y="25" font-family="Arial, sans-serif" font-size="14" fill="#555">shopping</text>
      <text x="220" y="25" font-family="Arial, sans-serif" font-size="12" fill="#999" text-anchor="end">1</text>
    </g>

    <!-- personal/travel -->
    <g transform="translate(0, 190)">
      <text x="48" y="25" font-family="Arial, sans-serif" font-size="14" fill="#555">#</text>
      <text x="60" y="25" font-family="Arial, sans-serif" font-size="14" fill="#555">travel</text>
      <text x="220" y="25" font-family="Arial, sans-serif" font-size="12" fill="#999" text-anchor="end">1</text>
    </g>

    <!-- code (collapsed) -->
    <g transform="translate(0, 220)">
      <text x="16" y="25" font-family="Arial, sans-serif" font-size="12" fill="#555">▸</text>
      <text x="32" y="25" font-family="Arial, sans-serif" font-size="14" fill="#555">#</text>
      <text x="44" y="25" font-family="Arial, sans-serif" font-size="14" fill="#555">code</text>
      <text x="220" y="25" font-family="Arial, sans-serif" font-size="12" fill="#999" text-anchor="end">1</text>
    </g>

    <!-- books -->
    <g transform="translate(0, 250)">
      <text x="32" y="25" font-family="Arial, sans-serif" font-size="14" fill="#555">#</text>
      <text x="44" y="25" font-family="Arial, sans-serif" font-size="14" fill="#555">books</text>
      <text x="220" y="25" font-family="Arial, sans-serif" font-size="12" fill="#999" text-anchor="end">1</text>
    </g>

    <!-- groceries -->
    <g transform="translate(0, 280)">
      <text x="32" y="25" font-family="Arial, sans-serif" font-size="14" fill="#555">#</text>
      <text x="44" y="25" font-family="Arial, sans-serif" font-size="14" fill="#555">groceries</text>
      <text x="220" y="25" font-family="Arial, sans-serif" font-size="12" fill="#999" text-anchor="end">1</text>
    </g>
  </g>
</svg>
