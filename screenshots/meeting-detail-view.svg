<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#374151;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4b5563;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#374151;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D9FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7B2FF7;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="250" height="800" fill="rgba(55, 65, 81, 0.5)" stroke="rgba(123, 47, 247, 0.2)" stroke-width="1"/>

  <!-- Logo -->
  <text x="125" y="50" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">FourBolt</text>

  <!-- Nav Items -->
  <g id="nav-record" transform="translate(25, 100)">
    <rect width="200" height="50" rx="8" fill="rgba(255, 255, 255, 0.05)"/>
    <circle cx="25" cy="25" r="8" fill="rgba(255, 255, 255, 0.6)"/>
    <text x="50" y="30" font-family="Arial, sans-serif" font-size="14" fill="rgba(255, 255, 255, 0.7)">Record</text>
  </g>

  <g id="nav-recordings" transform="translate(25, 160)">
    <rect width="200" height="50" rx="8" fill="url(#primary)" opacity="0.9"/>
    <rect x="15" y="15" width="20" height="20" rx="2" fill="white" stroke="none"/>
    <text x="50" y="30" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="white">Recordings</text>
  </g>

  <g id="nav-action-items" transform="translate(25, 220)">
    <rect width="200" height="50" rx="8" fill="rgba(255, 255, 255, 0.05)"/>
    <rect x="17" y="17" width="16" height="16" rx="2" fill="none" stroke="rgba(255, 255, 255, 0.6)" stroke-width="2"/>
    <text x="50" y="30" font-family="Arial, sans-serif" font-size="14" fill="rgba(255, 255, 255, 0.7)">Action Items</text>
  </g>

  <g id="nav-settings" transform="translate(25, 280)">
    <rect width="200" height="50" rx="8" fill="rgba(255, 255, 255, 0.05)"/>
    <circle cx="25" cy="25" r="8" fill="none" stroke="rgba(255, 255, 255, 0.6)" stroke-width="2"/>
    <text x="50" y="30" font-family="Arial, sans-serif" font-size="14" fill="rgba(255, 255, 255, 0.7)">Settings</text>
  </g>

  <!-- Main Content Area -->
  <g transform="translate(300, 30)">
    <!-- Header -->
    <g>
      <!-- Back Button -->
      <path d="M 10 30 L 20 20 L 20 40 Z" fill="#00D9FF"/>

      <!-- Meeting Title -->
      <text x="40" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white">Q4 Planning Session - FourBolt Roadmap</text>

      <!-- Metadata -->
      <g transform="translate(40, 50)">
        <text x="0" y="0" font-family="Arial, sans-serif" font-size="11" fill="rgba(255, 255, 255, 0.5)">10-28-2025</text>
        <text x="100" y="0" font-family="Arial, sans-serif" font-size="11" fill="rgba(255, 255, 255, 0.5)">45:32</text>
        <text x="180" y="0" font-family="Arial, sans-serif" font-size="11" fill="rgba(255, 255, 255, 0.5)">4 participants</text>
      </g>

      <!-- Export Button -->
      <rect x="700" y="10" width="120" height="40" rx="8" fill="url(#primary)"/>
      <text x="730" y="35" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="white">Export</text>
    </g>

    <!-- Tabs -->
    <g transform="translate(0, 90)">
      <rect x="0" y="0" width="120" height="40" rx="8" fill="url(#primary)"/>
      <text x="60" y="25" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="white" text-anchor="middle">Transcript</text>

      <rect x="130" y="0" width="120" height="40" rx="8" fill="rgba(55, 65, 81, 0.5)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <text x="190" y="25" font-family="Arial, sans-serif" font-size="13" fill="rgba(255, 255, 255, 0.7)" text-anchor="middle">Summary</text>

      <rect x="260" y="0" width="120" height="40" rx="8" fill="rgba(55, 65, 81, 0.5)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <text x="320" y="25" font-family="Arial, sans-serif" font-size="13" fill="rgba(255, 255, 255, 0.7)" text-anchor="middle">Analytics</text>
    </g>

    <!-- Transcript Content -->
    <g transform="translate(0, 150)">
      <!-- Transcript Segment 1 -->
      <rect x="0" y="0" width="850" height="120" rx="12" fill="rgba(55, 65, 81, 0.5)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>

      <!-- Avatar -->
      <circle cx="30" cy="30" r="20" fill="url(#primary)"/>
      <text x="30" y="36" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">SC</text>

      <!-- Speaker Info -->
      <text x="65" y="25" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="white">Sarah Chen</text>
      <text x="150" y="25" font-family="Arial, sans-serif" font-size="11" fill="rgba(255, 255, 255, 0.5)">00:00</text>

      <!-- Bookmark Icon -->
      <path d="M 800 15 L 800 40 L 810 33 L 820 40 L 820 15 Z" fill="none" stroke="#00D9FF" stroke-width="2"/>

      <!-- Text -->
      <text x="65" y="50" font-family="Arial, sans-serif" font-size="13" fill="white">Welcome everyone to our Q4 planning session. Today we'll discuss</text>
      <text x="65" y="68" font-family="Arial, sans-serif" font-size="13" fill="white">the FourBolt roadmap and prioritize features for the next quarter.</text>
      <text x="65" y="86" font-family="Arial, sans-serif" font-size="13" fill="white">Let's start by reviewing what we accomplished in Q3.</text>

      <!-- Transcript Segment 2 -->
      <rect x="0" y="135" width="850" height="100" rx="12" fill="rgba(55, 65, 81, 0.5)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>

      <!-- Avatar -->
      <circle cx="30" cy="165" r="20" fill="#7B2FF7"/>
      <text x="30" y="171" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">MR</text>

      <!-- Speaker Info -->
      <text x="65" y="160" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="white">Mike Ross</text>
      <text x="143" y="160" font-family="Arial, sans-serif" font-size="11" fill="rgba(255, 255, 255, 0.5)">02:15</text>

      <!-- Text -->
      <text x="65" y="185" font-family="Arial, sans-serif" font-size="13" fill="white">Thanks Sarah. In Q3 we successfully launched the color theme feature</text>
      <text x="65" y="203" font-family="Arial, sans-serif" font-size="13" fill="white">and completed the action items management dashboard.</text>

      <!-- Transcript Segment 3 -->
      <rect x="0" y="250" width="850" height="120" rx="12" fill="rgba(55, 65, 81, 0.5)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>

      <!-- Avatar -->
      <circle cx="30" cy="280" r="20" fill="#00D9FF"/>
      <text x="30" y="286" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">JL</text>

      <!-- Speaker Info -->
      <text x="65" y="275" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="white">Jennifer Liu</text>
      <text x="160" y="275" font-family="Arial, sans-serif" font-size="11" fill="rgba(255, 255, 255, 0.5)">03:45</text>

      <!-- Text -->
      <text x="65" y="300" font-family="Arial, sans-serif" font-size="13" fill="white">The user feedback has been overwhelmingly positive. I think we should</text>
      <text x="65" y="318" font-family="Arial, sans-serif" font-size="13" fill="white">focus on analytics features next. Customers are asking for better</text>
      <text x="65" y="336" font-family="Arial, sans-serif" font-size="13" fill="white">insights into their meeting patterns and speaking time distribution.</text>

      <!-- Transcript Segment 4 -->
      <rect x="0" y="385" width="850" height="100" rx="12" fill="rgba(55, 65, 81, 0.5)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>

      <!-- Avatar -->
      <circle cx="30" cy="415" r="20" fill="url(#primary)"/>
      <text x="30" y="421" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">DK</text>

      <!-- Speaker Info -->
      <text x="65" y="410" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="white">David Kim</text>
      <text x="150" y="410" font-family="Arial, sans-serif" font-size="11" fill="rgba(255, 255, 255, 0.5)">05:20</text>

      <!-- Text -->
      <text x="65" y="435" font-family="Arial, sans-serif" font-size="13" fill="white">I agree. We should also consider improving the export functionality</text>
      <text x="65" y="453" font-family="Arial, sans-serif" font-size="13" fill="white">to include more formats and customization options.</text>
    </g>
  </g>
</svg>