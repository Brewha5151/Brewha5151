<svg width="1400" height="900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#374151;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4b5563;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#374151;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D9FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7B2FF7;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1400" height="900" fill="url(#bg)"/>

  <!-- Top Navigation -->
  <rect x="0" y="0" width="1400" height="70" fill="rgba(0, 0, 0, 0.3)"/>

  <!-- Logo -->
  <text x="30" y="45" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white">FourBolt</text>

  <!-- Top Nav Icons -->
  <g transform="translate(1200, 25)">
    <!-- Settings icon -->
    <circle cx="20" cy="20" r="18" fill="rgba(255, 255, 255, 0.1)" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1"/>
    <circle cx="20" cy="20" r="8" fill="none" stroke="rgba(255, 255, 255, 0.6)" stroke-width="2"/>
    <line x1="20" y1="12" x2="20" y2="8" stroke="rgba(255, 255, 255, 0.6)" stroke-width="2"/>
  </g>

  <g transform="translate(1260, 25)">
    <!-- Action Items icon -->
    <circle cx="20" cy="20" r="18" fill="rgba(255, 255, 255, 0.1)" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1"/>
    <rect x="14" y="14" width="12" height="12" rx="2" fill="none" stroke="rgba(255, 255, 255, 0.6)" stroke-width="2"/>
    <polyline points="15,20 18,23 25,16" fill="none" stroke="rgba(255, 255, 255, 0.6)" stroke-width="2"/>
  </g>

  <!-- API Key Status Badge -->
  <rect x="1050" y="23" width="120" height="24" rx="12" fill="rgba(0, 217, 255, 0.2)" stroke="#00D9FF" stroke-width="1"/>
  <circle cx="1063" cy="35" r="4" fill="#00D9FF"/>
  <text x="1073" y="39" font-family="Arial, sans-serif" font-size="11" fill="#00D9FF">API Key Set</text>

  <!-- Left Sidebar - Recording Vault -->
  <rect x="0" y="70" width="320" height="830" fill="rgba(0, 0, 0, 0.2)"/>

  <text x="20" y="110" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="white">Recording Vault</text>

  <!-- Sample meetings -->
  <g transform="translate(20, 130)">
    <rect x="0" y="0" width="280" height="90" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(123, 47, 247, 0.3)" stroke-width="1"/>
    <text x="15" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="white">Team Standup</text>
    <text x="15" y="45" font-family="Arial, sans-serif" font-size="11" fill="rgba(255, 255, 255, 0.5)">Nov 14, 2025 • 15:23</text>
    <text x="15" y="65" font-family="Arial, sans-serif" font-size="11" fill="rgba(255, 255, 255, 0.5)">Duration: 12:45 • 3 speakers</text>
  </g>

  <g transform="translate(20, 235)">
    <rect x="0" y="0" width="280" height="90" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    <text x="15" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="white">Client Review</text>
    <text x="15" y="45" font-family="Arial, sans-serif" font-size="11" fill="rgba(255, 255, 255, 0.5)">Nov 13, 2025 • 10:00</text>
    <text x="15" y="65" font-family="Arial, sans-serif" font-size="11" fill="rgba(255, 255, 255, 0.5)">Duration: 45:12 • 5 speakers</text>
  </g>

  <g transform="translate(20, 340)">
    <rect x="0" y="0" width="280" height="90" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    <text x="15" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="white">Product Planning</text>
    <text x="15" y="45" font-family="Arial, sans-serif" font-size="11" fill="rgba(255, 255, 255, 0.5)">Nov 12, 2025 • 14:30</text>
    <text x="15" y="65" font-family="Arial, sans-serif" font-size="11" fill="rgba(255, 255, 255, 0.5)">Duration: 28:33 • 4 speakers</text>
  </g>

  <!-- Main Content Area -->
  <g transform="translate(360, 100)">
    <!-- Main Card -->
    <rect x="0" y="0" width="1000" height="760" rx="12" fill="rgba(55, 65, 81, 0.3)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>

    <!-- Title -->
    <text x="40" y="50" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white">Start New Recording</text>

    <!-- Meeting Title Input -->
    <text x="40" y="100" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="rgba(255, 255, 255, 0.6)">MEETING TITLE</text>
    <rect x="40" y="110" width="920" height="50" rx="8" fill="rgba(0, 0, 0, 0.3)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    <text x="55" y="142" font-family="Arial, sans-serif" font-size="15" fill="rgba(255, 255, 255, 0.4)">Enter meeting title or leave empty to auto-generate...</text>

    <!-- Waveform Container (Inactive) -->
    <rect x="40" y="200" width="920" height="180" rx="12" fill="rgba(0, 0, 0, 0.3)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>

    <!-- Inactive Waveform -->
    <g transform="translate(80, 250)">
      <rect x="0" y="40" width="4" height="20" rx="2" fill="rgba(255, 255, 255, 0.1)"/>
      <rect x="12" y="35" width="4" height="30" rx="2" fill="rgba(255, 255, 255, 0.1)"/>
      <rect x="24" y="30" width="4" height="40" rx="2" fill="rgba(255, 255, 255, 0.1)"/>
      <rect x="36" y="38" width="4" height="24" rx="2" fill="rgba(255, 255, 255, 0.1)"/>
      <rect x="48" y="42" width="4" height="16" rx="2" fill="rgba(255, 255, 255, 0.1)"/>
      <rect x="60" y="36" width="4" height="28" rx="2" fill="rgba(255, 255, 255, 0.1)"/>
      <rect x="72" y="32" width="4" height="36" rx="2" fill="rgba(255, 255, 255, 0.1)"/>
      <rect x="84" y="40" width="4" height="20" rx="2" fill="rgba(255, 255, 255, 0.1)"/>
      <!-- More bars -->
      <rect x="96" y="38" width="4" height="24" rx="2" fill="rgba(255, 255, 255, 0.1)"/>
      <rect x="108" y="34" width="4" height="32" rx="2" fill="rgba(255, 255, 255, 0.1)"/>
      <rect x="120" y="40" width="4" height="20" rx="2" fill="rgba(255, 255, 255, 0.1)"/>
    </g>

    <!-- Waveform Label -->
    <text x="500" y="310" font-family="Arial, sans-serif" font-size="14" fill="rgba(255, 255, 255, 0.3)" text-anchor="middle">Audio Waveform (Inactive)</text>

    <!-- Large Record Button -->
    <g transform="translate(500, 460)">
      <circle cx="0" cy="0" r="60" fill="url(#primary)" opacity="0.9"/>
      <circle cx="0" cy="0" r="20" fill="white"/>
      <text x="0" y="100" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="white" text-anchor="middle">Click to Start Recording</text>
    </g>

    <!-- Status Text -->
    <rect x="370" y="600" width="260" height="36" rx="18" fill="rgba(0, 0, 0, 0.3)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1"/>
    <circle cx="395" cy="618" r="6" fill="#6B7280"/>
    <text x="410" y="623" font-family="Arial, sans-serif" font-size="13" fill="rgba(255, 255, 255, 0.6)">Ready to Record</text>

    <!-- Instructions -->
    <text x="500" y="680" font-family="Arial, sans-serif" font-size="13" fill="rgba(255, 255, 255, 0.5)" text-anchor="middle">Click the button above to start recording</text>
    <text x="500" y="700" font-family="Arial, sans-serif" font-size="13" fill="rgba(255, 255, 255, 0.5)" text-anchor="middle">Gemini AI will transcribe your meeting every 10 seconds</text>
  </g>
</svg>
