<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#374151;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4b5563;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#374151;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D9FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7B2FF7;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- Sidebar -->
  <rect x="0" y="0" width="250" height="800" fill="rgba(55, 65, 81, 0.5)" stroke="rgba(123, 47, 247, 0.2)" stroke-width="1"/>

  <!-- Logo -->
  <text x="125" y="50" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle">FourBolt</text>

  <!-- Nav Items -->
  <g id="nav-record" transform="translate(25, 100)">
    <rect width="200" height="50" rx="8" fill="url(#primary)" opacity="0.9"/>
    <circle cx="25" cy="25" r="8" fill="white"/>
    <text x="50" y="30" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="white">Record</text>
  </g>

  <g id="nav-recordings" transform="translate(25, 160)">
    <rect width="200" height="50" rx="8" fill="rgba(255, 255, 255, 0.05)"/>
    <rect x="15" y="15" width="20" height="20" rx="2" fill="rgba(255, 255, 255, 0.6)" stroke="none"/>
    <text x="50" y="30" font-family="Arial, sans-serif" font-size="14" fill="rgba(255, 255, 255, 0.7)">Recordings</text>
  </g>

  <g id="nav-action-items" transform="translate(25, 220)">
    <rect width="200" height="50" rx="8" fill="rgba(255, 255, 255, 0.05)"/>
    <rect x="17" y="17" width="16" height="16" rx="2" fill="none" stroke="rgba(255, 255, 255, 0.6)" stroke-width="2"/>
    <text x="50" y="30" font-family="Arial, sans-serif" font-size="14" fill="rgba(255, 255, 255, 0.7)">Action Items</text>
  </g>

  <g id="nav-settings" transform="translate(25, 280)">
    <rect width="200" height="50" rx="8" fill="rgba(255, 255, 255, 0.05)"/>
    <circle cx="25" cy="25" r="8" fill="none" stroke="rgba(255, 255, 255, 0.6)" stroke-width="2"/>
    <text x="50" y="30" font-family="Arial, sans-serif" font-size="14" fill="rgba(255, 255, 255, 0.7)">Settings</text>
  </g>

  <!-- Main Content Area -->
  <g transform="translate(300, 50)">
    <!-- Recording Card -->
    <rect x="0" y="0" width="850" height="680" rx="12" fill="rgba(55, 65, 81, 0.5)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>

    <!-- Title -->
    <text x="30" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="white">New Recording</text>

    <!-- Meeting Title Input -->
    <text x="30" y="80" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="rgba(255, 255, 255, 0.6)">Meeting Title</text>
    <rect x="30" y="90" width="790" height="45" rx="8" fill="rgba(0, 0, 0, 0.2)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    <text x="45" y="118" font-family="Arial, sans-serif" font-size="14" fill="rgba(255, 255, 255, 0.5)">Enter meeting title...</text>

    <!-- Template Section -->
    <text x="30" y="165" font-family="Arial, sans-serif" font-size="12" font-weight="500" fill="rgba(255, 255, 255, 0.6)">Template</text>

    <!-- Template Buttons -->
    <g transform="translate(30, 175)">
      <rect x="0" y="0" width="190" height="50" rx="8" fill="rgba(0, 0, 0, 0.2)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <circle cx="25" cy="25" r="6" fill="#00D9FF"/>
      <text x="45" y="30" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="white">General Meeting</text>

      <rect x="200" y="0" width="190" height="50" rx="8" fill="rgba(0, 0, 0, 0.2)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <circle cx="225" cy="25" r="6" fill="#7B2FF7"/>
      <text x="245" y="30" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="white">Standup</text>

      <rect x="400" y="0" width="190" height="50" rx="8" fill="rgba(0, 0, 0, 0.2)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <circle cx="425" cy="25" r="6" fill="#00D9FF"/>
      <text x="445" y="30" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="white">Retrospective</text>

      <rect x="600" y="0" width="190" height="50" rx="8" fill="rgba(0, 0, 0, 0.2)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <circle cx="625" cy="25" r="6" fill="#7B2FF7"/>
      <text x="645" y="30" font-family="Arial, sans-serif" font-size="13" font-weight="500" fill="white">Sales</text>
    </g>

    <!-- Large Record Button -->
    <circle cx="425" cy="320" r="40" fill="url(#primary)"/>
    <circle cx="425" cy="320" r="32" fill="white"/>
    <circle cx="425" cy="320" r="15" fill="url(#primary)"/>

    <!-- Notes Section -->
    <rect x="30" y="400" width="790" height="250" rx="12" fill="rgba(55, 65, 81, 0.5)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>

    <!-- Notes Header -->
    <rect x="30" y="400" width="790" height="60" rx="12" fill="rgba(0, 0, 0, 0.1)"/>
    <rect x="45" y="415" width="16" height="16" rx="2" fill="none" stroke="#00D9FF" stroke-width="2"/>
    <text x="70" y="430" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="white">Notes</text>

    <!-- Formatting Toolbar -->
    <g transform="translate(45, 470)">
      <rect x="0" y="0" width="32" height="32" rx="6" fill="rgba(255, 255, 255, 0.1)"/>
      <text x="9" y="22" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">B</text>

      <rect x="40" y="0" width="32" height="32" rx="6" fill="rgba(255, 255, 255, 0.1)"/>
      <text x="49" y="22" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="white">I</text>

      <rect x="80" y="0" width="32" height="32" rx="6" fill="rgba(255, 255, 255, 0.1)"/>
      <circle cx="96" cy="10" r="2" fill="white"/>
      <circle cx="96" cy="16" r="2" fill="white"/>
      <circle cx="96" cy="22" r="2" fill="white"/>
    </g>

    <!-- Notes Content Area -->
    <rect x="45" y="515" width="760" height="120" rx="8" fill="rgba(0, 0, 0, 0.2)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    <text x="60" y="540" font-family="Arial, sans-serif" font-size="13" fill="rgba(255, 255, 255, 0.6)">Take notes during your meeting...</text>
    <text x="60" y="560" font-family="Arial, sans-serif" font-size="13" fill="rgba(255, 255, 255, 0.4)">• Format with Bold, Italic, or Lists</text>
    <text x="60" y="580" font-family="Arial, sans-serif" font-size="13" fill="rgba(255, 255, 255, 0.4)">• Notes are saved automatically</text>
  </g>
</svg>