<svg width="1400" height="900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#374151;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4b5563;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#374151;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D9FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7B2FF7;stop-opacity:1" />
    </linearGradient>
  </defs>

  <rect width="1400" height="900" fill="url(#bg)"/>

  <!-- Top Navigation -->
  <rect x="0" y="0" width="1400" height="70" fill="rgba(0, 0, 0, 0.3)"/>
  <text x="30" y="45" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white">FourBolt</text>

  <!-- Left Sidebar - Recording Vault -->
  <rect x="0" y="70" width="320" height="830" fill="rgba(0, 0, 0, 0.2)"/>
  <text x="20" y="110" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="white">Recording Vault</text>

  <!-- Meetings List -->
  <g transform="translate(20, 130)">
    <rect x="0" y="0" width="280" height="90" rx="8" fill="rgba(123, 47, 247, 0.2)" stroke="#7B2FF7" stroke-width="2"/>
    <text x="15" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="white">Team Standup</text>
    <text x="15" y="45" font-family="Arial, sans-serif" font-size="11" fill="rgba(255, 255, 255, 0.5)">Nov 14, 2025 • 10:30 AM</text>
    <text x="15" y="65" font-family="Arial, sans-serif" font-size="11" fill="rgba(255, 255, 255, 0.5)">Duration: 12:45 • 3 speakers</text>
  </g>

  <!-- Main Content Area -->
  <g transform="translate(360, 100)">
    <rect x="0" y="0" width="1000" height="760" rx="12" fill="rgba(55, 65, 81, 0.3)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>

    <!-- Meeting Header -->
    <g transform="translate(40, 40)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white">Team Standup</text>
      <text x="0" y="28" font-family="Arial, sans-serif" font-size="13" fill="rgba(255, 255, 255, 0.6)">Nov 14, 2025 at 10:30 AM • Duration: 12:45 • 3 speakers</text>
    </g>

    <!-- Tab Bar -->
    <g transform="translate(40, 100)">
      <!-- Transcript Tab -->
      <rect x="0" y="0" width="140" height="48" rx="8" fill="rgba(255, 255, 255, 0.05)"/>
      <text x="70" y="30" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="rgba(255, 255, 255, 0.6)" text-anchor="middle">Transcript</text>

      <!-- Summary Tab (Active) -->
      <rect x="150" y="0" width="140" height="48" rx="8" fill="url(#primary)" opacity="0.9"/>
      <text x="220" y="30" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="white" text-anchor="middle">Summary</text>

      <!-- Analytics Tab -->
      <rect x="300" y="0" width="140" height="48" rx="8" fill="rgba(255, 255, 255, 0.05)"/>
      <text x="370" y="30" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="rgba(255, 255, 255, 0.6)" text-anchor="middle">Analytics</text>
    </g>

    <!-- Gemini Badge -->
    <g transform="translate(750, 110)">
      <rect x="0" y="0" width="180" height="32" rx="16" fill="rgba(123, 47, 247, 0.2)" stroke="#7B2FF7" stroke-width="1"/>
      <text x="20" y="21" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#7B2FF7">✨ Generated by Gemini AI</text>
    </g>

    <!-- Summary Content -->
    <g transform="translate(40, 180)">
      <!-- Main Summary Section -->
      <rect x="0" y="0" width="920" height="140" rx="12" fill="rgba(123, 47, 247, 0.1)" stroke="rgba(123, 47, 247, 0.2)" stroke-width="1"/>

      <text x="20" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="white">📋 Meeting Summary</text>

      <text x="20" y="60" font-family="Arial, sans-serif" font-size="13" fill="rgba(255, 255, 255, 0.9)">This was a brief team standup focused on the upcoming Friday deployment.</text>
      <text x="20" y="80" font-family="Arial, sans-serif" font-size="13" fill="rgba(255, 255, 255, 0.9)">Sarah provided an update on the payment gateway API integration, confirming</text>
      <text x="20" y="100" font-family="Arial, sans-serif" font-size="13" fill="rgba(255, 255, 255, 0.9)">completion of the initial implementation. The team discussed timelines and</text>
      <text x="20" y="120" font-family="Arial, sans-serif" font-size="13" fill="rgba(255, 255, 255, 0.9)">coordinated a code review session for Thursday afternoon.</text>

      <!-- Key Discussion Points -->
      <g transform="translate(0, 170)">
        <rect x="0" y="0" width="920" height="180" rx="12" fill="rgba(0, 0, 0, 0.2)"/>

        <text x="20" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="white">💬 Key Discussion Points</text>

        <g transform="translate(20, 50)">
          <circle cx="8" cy="-2" r="4" fill="#00D9FF"/>
          <text x="25" y="2" font-family="Arial, sans-serif" font-size="13" fill="rgba(255, 255, 255, 0.9)">Payment gateway API integration completed</text>

          <circle cx="8" cy="28" r="4" fill="#00D9FF"/>
          <text x="25" y="32" font-family="Arial, sans-serif" font-size="13" fill="rgba(255, 255, 255, 0.9)">Next steps: error handling and test coverage implementation</text>

          <circle cx="8" cy="58" r="4" fill="#00D9FF"/>
          <text x="25" y="62" font-family="Arial, sans-serif" font-size="13" fill="rgba(255, 255, 255, 0.9)">Friday deployment timeline confirmed as on track</text>

          <circle cx="8" cy="88" r="4" fill="#00D9FF"/>
          <text x="25" y="92" font-family="Arial, sans-serif" font-size="13" fill="rgba(255, 255, 255, 0.9)">Code review scheduled for Thursday afternoon</text>

          <circle cx="8" cy="118" r="4" fill="#00D9FF"/>
          <text x="25" y="122" font-family="Arial, sans-serif" font-size="13" fill="rgba(255, 255, 255, 0.9)">Team coordination on final preparation for client demo</text>
        </g>
      </g>

      <!-- Action Items -->
      <g transform="translate(0, 380)">
        <rect x="0" y="0" width="920" height="240" rx="12" fill="rgba(0, 0, 0, 0.2)"/>

        <text x="20" y="30" font-family="Arial, sans-serif" font-size="16" font-weight="600" fill="white">✓ Action Items</text>

        <!-- Action Item 1 -->
        <g transform="translate(20, 50)">
          <rect x="0" y="0" width="880" height="50" rx="8" fill="rgba(123, 47, 247, 0.1)" stroke="rgba(123, 47, 247, 0.2)" stroke-width="1"/>

          <rect x="15" y="16" width="18" height="18" rx="4" fill="none" stroke="#7B2FF7" stroke-width="2"/>

          <text x="45" y="25" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="white">Implement error handling for payment gateway</text>

          <rect x="450" y="12" width="90" height="22" rx="11" fill="rgba(239, 68, 68, 0.2)"/>
          <text x="495" y="27" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#EF4444" text-anchor="middle">High Priority</text>

          <text x="560" y="27" font-family="Arial, sans-serif" font-size="11" fill="rgba(255, 255, 255, 0.6)">Assigned: Sarah</text>

          <text x="720" y="27" font-family="Arial, sans-serif" font-size="11" fill="rgba(255, 255, 255, 0.6)">Due: Thursday</text>
        </g>

        <!-- Action Item 2 -->
        <g transform="translate(20, 115)">
          <rect x="0" y="0" width="880" height="50" rx="8" fill="rgba(123, 47, 247, 0.1)" stroke="rgba(123, 47, 247, 0.2)" stroke-width="1"/>

          <rect x="15" y="16" width="18" height="18" rx="4" fill="none" stroke="#7B2FF7" stroke-width="2"/>

          <text x="45" y="25" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="white">Add comprehensive test coverage</text>

          <rect x="450" y="12" width="90" height="22" rx="11" fill="rgba(251, 191, 36, 0.2)"/>
          <text x="495" y="27" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#FBBF24" text-anchor="middle">Medium</text>

          <text x="560" y="27" font-family="Arial, sans-serif" font-size="11" fill="rgba(255, 255, 255, 0.6)">Assigned: Sarah</text>

          <text x="720" y="27" font-family="Arial, sans-serif" font-size="11" fill="rgba(255, 255, 255, 0.6)">Due: Thursday</text>
        </g>

        <!-- Action Item 3 -->
        <g transform="translate(20, 180)">
          <rect x="0" y="0" width="880" height="50" rx="8" fill="rgba(123, 47, 247, 0.1)" stroke="rgba(123, 47, 247, 0.2)" stroke-width="1"/>

          <rect x="15" y="16" width="18" height="18" rx="4" fill="none" stroke="#7B2FF7" stroke-width="2"/>

          <text x="45" y="25" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="white">Conduct code review session</text>

          <rect x="450" y="12" width="90" height="22" rx="11" fill="rgba(239, 68, 68, 0.2)"/>
          <text x="495" y="27" font-family="Arial, sans-serif" font-size="11" font-weight="600" fill="#EF4444" text-anchor="middle">High Priority</text>

          <text x="560" y="27" font-family="Arial, sans-serif" font-size="11" fill="rgba(255, 255, 255, 0.6)">Assigned: Team</text>

          <text x="720" y="27" font-family="Arial, sans-serif" font-size="11" fill="rgba(255, 255, 255, 0.6)">Due: Thursday</text>
        </g>
      </g>
    </g>
  </g>
</svg>
