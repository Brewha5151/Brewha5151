<svg width="1400" height="900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#374151;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4b5563;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#374151;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D9FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7B2FF7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="waveform" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7B2FF7;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#00D9FF;stop-opacity:0.8" />
    </linearGradient>
  </defs>

  <rect width="1400" height="900" fill="url(#bg)"/>

  <!-- Top Navigation -->
  <rect x="0" y="0" width="1400" height="70" fill="rgba(0, 0, 0, 0.3)"/>
  <text x="30" y="45" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="white">FourBolt</text>

  <!-- Recording Indicator -->
  <g transform="translate(900, 25)">
    <circle cx="20" cy="20" r="8" fill="#EF4444">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="35" y="28" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#EF4444">RECORDING</text>
  </g>

  <!-- Timer -->
  <text x="1050" y="45" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="white">02:34</text>

  <!-- Left Sidebar -->
  <rect x="0" y="70" width="320" height="830" fill="rgba(0, 0, 0, 0.2)"/>
  <text x="20" y="110" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="white">Recording Vault</text>

  <!-- Main Content - Split Layout -->
  <g transform="translate(360, 100)">
    <!-- Left Panel - Notes -->
    <rect x="0" y="0" width="480" height="760" rx="12" fill="rgba(55, 65, 81, 0.3)" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>

    <text x="30" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="white">Team Standup</text>

    <!-- Active Waveform -->
    <rect x="30" y="70" width="420" height="120" rx="8" fill="rgba(0, 0, 0, 0.3)"/>
    <g transform="translate(50, 100)">
      <rect x="0" y="40" width="4" height="35" rx="2" fill="url(#waveform)"/>
      <rect x="10" y="25" width="4" height="50" rx="2" fill="url(#waveform)"/>
      <rect x="20" y="15" width="4" height="70" rx="2" fill="url(#waveform)"/>
      <rect x="30" y="30" width="4" height="40" rx="2" fill="url(#waveform)"/>
      <rect x="40" y="35" width="4" height="30" rx="2" fill="url(#waveform)"/>
      <rect x="50" y="20" width="4" height="60" rx="2" fill="url(#waveform)"/>
      <rect x="60" y="10" width="4" height="80" rx="2" fill="url(#waveform)"/>
      <rect x="70" y="28" width="4" height="44" rx="2" fill="url(#waveform)"/>
      <rect x="80" y="32" width="4" height="36" rx="2" fill="url(#waveform)"/>
      <rect x="90" y="22" width="4" height="56" rx="2" fill="url(#waveform)"/>
      <rect x="100" y="18" width="4" height="64" rx="2" fill="url(#waveform)"/>
      <rect x="110" y="26" width="4" height="48" rx="2" fill="url(#waveform)"/>
      <rect x="120" y="34" width="4" height="32" rx="2" fill="url(#waveform)"/>
      <rect x="130" y="24" width="4" height="52" rx="2" fill="url(#waveform)"/>
      <rect x="140" y="16" width="4" height="68" rx="2" fill="url(#waveform)"/>
      <rect x="150" y="30" width="4" height="40" rx="2" fill="url(#waveform)"/>
      <rect x="160" y="20" width="4" height="60" rx="2" fill="url(#waveform)"/>
      <rect x="170" y="28" width="4" height="44" rx="2" fill="url(#waveform)"/>
      <rect x="180" y="36" width="4" height="28" rx="2" fill="url(#waveform)"/>
      <rect x="190" y="22" width="4" height="56" rx="2" fill="url(#waveform)"/>
      <rect x="200" y="14" width="4" height="72" rx="2" fill="url(#waveform)"/>
      <rect x="210" y="26" width="4" height="48" rx="2" fill="url(#waveform)"/>
      <rect x="220" y="32" width="4" height="36" rx="2" fill="url(#waveform)"/>
      <rect x="230" y="18" width="4" height="64" rx="2" fill="url(#waveform)"/>
      <rect x="240" y="24" width="4" height="52" rx="2" fill="url(#waveform)"/>
      <rect x="250" y="30" width="4" height="40" rx="2" fill="url(#waveform)"/>
      <rect x="260" y="20" width="4" height="60" rx="2" fill="url(#waveform)"/>
      <rect x="270" y="28" width="4" height="44" rx="2" fill="url(#waveform)"/>
      <rect x="280" y="34" width="4" height="32" rx="2" fill="url(#waveform)"/>
      <rect x="290" y="22" width="4" height="56" rx="2" fill="url(#waveform)"/>
      <rect x="300" y="16" width="4" height="68" rx="2" fill="url(#waveform)"/>
      <rect x="310" y="26" width="4" height="48" rx="2" fill="url(#waveform)"/>
      <rect x="320" y="32" width="4" height="36" rx="2" fill="url(#waveform)"/>
      <rect x="330" y="18" width="4" height="64" rx="2" fill="url(#waveform)"/>
      <rect x="340" y="24" width="4" height="52" rx="2" fill="url(#waveform)"/>
      <rect x="350" y="30" width="4" height="40" rx="2" fill="url(#waveform)"/>
      <rect x="360" y="20" width="4" height="60" rx="2" fill="url(#waveform)"/>
      <rect x="370" y="28" width="4" height="44" rx="2" fill="url(#waveform)"/>
      <rect x="380" y="36" width="4" height="28" rx="2" fill="url(#waveform)"/>
    </g>

    <!-- Control Buttons -->
    <g transform="translate(30, 220)">
      <!-- Pause Button -->
      <rect x="0" y="0" width="200" height="50" rx="8" fill="rgba(251, 191, 36, 0.2)" stroke="#FBBF24" stroke-width="2"/>
      <rect x="85" y="17" width="6" height="16" rx="1" fill="#FBBF24"/>
      <rect x="95" y="17" width="6" height="16" rx="1" fill="#FBBF24"/>
      <text x="115" y="32" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#FBBF24">Pause</text>

      <!-- Stop Button -->
      <rect x="220" y="0" width="200" height="50" rx="8" fill="rgba(239, 68, 68, 0.2)" stroke="#EF4444" stroke-width="2"/>
      <rect x="305" y="20" width="10" height="10" rx="1" fill="#EF4444"/>
      <text x="325" y="32" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#EF4444">Stop</text>
    </g>

    <!-- Notes Section -->
    <rect x="30" y="300" width="420" height="430" rx="8" fill="rgba(0, 0, 0, 0.3)"/>
    <text x="50" y="330" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="white">Meeting Notes</text>

    <!-- Formatting Toolbar -->
    <g transform="translate(50, 345)">
      <rect x="0" y="0" width="32" height="32" rx="6" fill="rgba(255, 255, 255, 0.1)"/>
      <text x="9" y="22" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">B</text>
      <rect x="40" y="0" width="32" height="32" rx="6" fill="rgba(255, 255, 255, 0.1)"/>
      <text x="49" y="22" font-family="Arial, sans-serif" font-size="14" font-style="italic" fill="white">I</text>
      <rect x="80" y="0" width="32" height="32" rx="6" fill="rgba(255, 255, 255, 0.1)"/>
      <text x="89" y="22" font-family="Arial, sans-serif" font-size="14" fill="white">•</text>
    </g>

    <!-- Notes Content -->
    <text x="50" y="410" font-family="Arial, sans-serif" font-size="13" fill="rgba(255, 255, 255, 0.8)">• Discussed Q4 goals</text>
    <text x="50" y="435" font-family="Arial, sans-serif" font-size="13" fill="rgba(255, 255, 255, 0.8)">• Sarah working on API integration</text>
    <text x="50" y="460" font-family="Arial, sans-serif" font-size="13" fill="rgba(255, 255, 255, 0.8)">• Deploy scheduled for Friday</text>
  </g>

  <!-- Right Panel - Live Transcription -->
  <g transform="translate(870, 100)">
    <rect x="0" y="0" width="490" height="760" rx="12" fill="rgba(55, 65, 81, 0.3)" stroke="rgba(123, 47, 247, 0.3)" stroke-width="2"/>

    <!-- Header with Gemini Badge -->
    <text x="30" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="white">Live Transcription</text>

    <rect x="30" y="55" width="250" height="28" rx="14" fill="rgba(123, 47, 247, 0.2)" stroke="#7B2FF7" stroke-width="1"/>
    <text x="45" y="74" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#7B2FF7">✨ Gemini AI (Every 10s)</text>

    <!-- Status Indicator -->
    <g transform="translate(30, 105)">
      <rect x="0" y="0" width="150" height="30" rx="15" fill="rgba(16, 185, 129, 0.2)"/>
      <circle cx="20" cy="15" r="5" fill="#10B981">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="35" y="20" font-family="Arial, sans-serif" font-size="12" fill="#10B981">Listening...</text>
    </g>

    <!-- Transcript Content -->
    <g transform="translate(30, 160)">
      <!-- Timestamp 1 -->
      <text x="0" y="0" font-family="monospace" font-size="11" fill="rgba(0, 217, 255, 0.6)">[00:00]</text>
      <text x="60" y="0" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#00D9FF">Speaker 1</text>
      <text x="0" y="22" font-family="Arial, sans-serif" font-size="13" fill="rgba(255, 255, 255, 0.9)">Good morning everyone. Let's start with our</text>
      <text x="0" y="42" font-family="Arial, sans-serif" font-size="13" fill="rgba(255, 255, 255, 0.9)">quick standup. Sarah, do you want to go first?</text>

      <!-- Timestamp 2 -->
      <text x="0" y="80" font-family="monospace" font-size="11" fill="rgba(123, 47, 247, 0.6)">[00:15]</text>
      <text x="60" y="80" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#7B2FF7">Speaker 2</text>
      <text x="0" y="102" font-family="Arial, sans-serif" font-size="13" fill="rgba(255, 255, 255, 0.9)">Sure! Yesterday I completed the API integration</text>
      <text x="0" y="122" font-family="Arial, sans-serif" font-size="13" fill="rgba(255, 255, 255, 0.9)">for the payment gateway. Today I'm going to</text>
      <text x="0" y="142" font-family="Arial, sans-serif" font-size="13" fill="rgba(255, 255, 255, 0.9)">start working on the error handling and tests.</text>

      <!-- Timestamp 3 -->
      <text x="0" y="180" font-family="monospace" font-size="11" fill="rgba(0, 217, 255, 0.6)">[00:38]</text>
      <text x="60" y="180" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#00D9FF">Speaker 1</text>
      <text x="0" y="202" font-family="Arial, sans-serif" font-size="13" fill="rgba(255, 255, 255, 0.9)">Great progress! Are you on track for the</text>
      <text x="0" y="222" font-family="Arial, sans-serif" font-size="13" fill="rgba(255, 255, 255, 0.9)">Friday deployment?</text>

      <!-- Timestamp 4 -->
      <text x="0" y="260" font-family="monospace" font-size="11" fill="rgba(123, 47, 247, 0.6)">[00:52]</text>
      <text x="60" y="260" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#7B2FF7">Speaker 2</text>
      <text x="0" y="282" font-family="Arial, sans-serif" font-size="13" fill="rgba(255, 255, 255, 0.9)">Yes, absolutely. I should have everything</text>
      <text x="0" y="302" font-family="Arial, sans-serif" font-size="13" fill="rgba(255, 255, 255, 0.9)">ready by Thursday afternoon for review.</text>

      <!-- Timestamp 5 -->
      <text x="0" y="340" font-family="monospace" font-size="11" fill="rgba(0, 217, 255, 0.6)">[01:12]</text>
      <text x="60" y="340" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#00D9FF">Speaker 3</text>
      <text x="0" y="362" font-family="Arial, sans-serif" font-size="13" fill="rgba(255, 255, 255, 0.9)">I can help review the code if you need a</text>
      <text x="0" y="382" font-family="Arial, sans-serif" font-size="13" fill="rgba(255, 255, 255, 0.9)">second pair of eyes on the implementation.</text>

      <!-- Latest - being transcribed -->
      <text x="0" y="420" font-family="monospace" font-size="11" fill="rgba(0, 217, 255, 0.6)">[02:34]</text>
      <text x="60" y="420" font-family="Arial, sans-serif" font-size="13" font-weight="600" fill="#00D9FF">Speaker 1</text>
      <text x="0" y="442" font-family="Arial, sans-serif" font-size="13" fill="rgba(255, 255, 255, 0.9)">That would be perfect. Let's plan for a code</text>
      <text x="0" y="462" font-family="Arial, sans-serif" font-size="13" fill="rgba(255, 255, 255, 0.7)">review session on Thursday...</text>

      <!-- Cursor animation -->
      <rect x="220" y="450" width="2" height="14" fill="#00D9FF">
        <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Processing Indicator -->
    <g transform="translate(30, 680)">
      <rect x="0" y="0" width="430" height="50" rx="8" fill="rgba(123, 47, 247, 0.1)" stroke="rgba(123, 47, 247, 0.3)" stroke-width="1"/>
      <text x="15" y="30" font-family="Arial, sans-serif" font-size="12" fill="rgba(123, 47, 247, 0.8)">Processing next chunk in 7 seconds...</text>
      <circle cx="400" cy="25" r="4" fill="#7B2FF7">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
</svg>
