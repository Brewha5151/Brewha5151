<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="800" fill="#ffffff"/>

  <!-- Sidebar -->
  <rect width="200" height="800" fill="#f5f5f7"/>
  <line x1="200" y1="0" x2="200" y2="800" stroke="#d2d2d7" stroke-width="1"/>

  <!-- Sidebar Header -->
  <text x="20" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#1d1d1f">FourBolt</text>
  <line x1="20" y1="60" x2="180" y2="60" stroke="#d2d2d7" stroke-width="1"/>

  <!-- Sidebar Nav - Record -->
  <circle cx="28" cy="102" r="8" stroke="#1d1d1f" stroke-width="2" fill="none"/>
  <text x="50" y="107" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#1d1d1f">Record</text>

  <!-- Sidebar Nav - History (Active) -->
  <rect x="0" y="124" width="200" height="44" fill="#007aff"/>
  <rect x="20" y="136" width="14" height="14" stroke="#ffffff" stroke-width="1.5" fill="none" rx="2"/>
  <text x="50" y="147" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#ffffff">History</text>

  <!-- Sidebar Nav - Settings -->
  <circle cx="28" cy="182" r="8" stroke="#1d1d1f" stroke-width="1.5" fill="none"/>
  <circle cx="28" cy="182" r="3" fill="#1d1d1f"/>
  <text x="50" y="187" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#1d1d1f">Settings</text>

  <!-- Main Content Header -->
  <text x="240" y="60" font-family="Arial, sans-serif" font-size="32" font-weight="600" fill="#1d1d1f">Recording History</text>

  <!-- Search Bar -->
  <rect x="240" y="90" width="500" height="44" fill="#ffffff" stroke="#d2d2d7" stroke-width="1" rx="8"/>
  <text x="260" y="117" font-family="Arial, sans-serif" font-size="14" fill="#6e6e73">Search recordings...</text>
  <rect x="755" y="90" width="100" height="44" fill="#f5f5f7" rx="8"/>
  <circle cx="775" cy="112" r="8" stroke="#1d1d1f" stroke-width="1.5" fill="none"/>
  <text x="795" y="118" font-family="Arial, sans-serif" font-size="14" font-weight="500" fill="#1d1d1f">Search</text>

  <!-- Recording Card 1 -->
  <rect x="240" y="160" width="560" height="140" fill="#f5f5f7" rx="12"/>
  <text x="260" y="188" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#1d1d1f">Team Meeting - Q1 Planning</text>
  <rect x="750" y="170" width="32" height="32" fill="transparent"/>
  <rect x="756" y="179" width="14" height="16" stroke="#ff3b30" stroke-width="1.5" fill="none" rx="2"/>
  <line x1="756" y1="177" x2="770" y2="177" stroke="#ff3b30" stroke-width="1.5"/>

  <circle cx="266" cy="215" r="6" stroke="#1d1d1f" stroke-width="1.5" fill="none"/>
  <text x="280" y="220" font-family="Arial, sans-serif" font-size="13" fill="#6e6e73">45m 23s</text>

  <rect x="360" y="207" width="12" height="12" stroke="#1d1d1f" stroke-width="1.5" fill="none" rx="2"/>
  <text x="380" y="220" font-family="Arial, sans-serif" font-size="13" fill="#6e6e73">Jan 15, 2025, 2:30 PM</text>

  <text x="260" y="245" font-family="Arial, sans-serif" font-size="13" fill="#6e6e73">Discussed Q1 goals, budget allocation, and team structure.</text>
  <text x="260" y="265" font-family="Arial, sans-serif" font-size="13" fill="#6e6e73">Key decisions made on product roadmap...</text>

  <!-- Recording Card 2 -->
  <rect x="240" y="320" width="560" height="140" fill="#f5f5f7" rx="12"/>
  <text x="260" y="348" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#1d1d1f">Client Interview - Product Feedback</text>
  <rect x="750" y="330" width="32" height="32" fill="transparent"/>
  <rect x="756" y="339" width="14" height="16" stroke="#ff3b30" stroke-width="1.5" fill="none" rx="2"/>
  <line x1="756" y1="337" x2="770" y2="337" stroke="#ff3b30" stroke-width="1.5"/>

  <circle cx="266" cy="375" r="6" stroke="#1d1d1f" stroke-width="1.5" fill="none"/>
  <text x="280" y="380" font-family="Arial, sans-serif" font-size="13" fill="#6e6e73">32m 15s</text>

  <rect x="360" y="367" width="12" height="12" stroke="#1d1d1f" stroke-width="1.5" fill="none" rx="2"/>
  <text x="380" y="380" font-family="Arial, sans-serif" font-size="13" fill="#6e6e73">Jan 14, 2025, 10:00 AM</text>

  <text x="260" y="405" font-family="Arial, sans-serif" font-size="13" fill="#6e6e73">Customer expressed interest in new features. Discussed pricing</text>
  <text x="260" y="425" font-family="Arial, sans-serif" font-size="13" fill="#6e6e73">and implementation timeline...</text>

  <!-- Recording Card 3 -->
  <rect x="240" y="480" width="560" height="140" fill="#f5f5f7" rx="12"/>
  <text x="260" y="508" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#1d1d1f">Design Review - UI Mockups</text>
  <rect x="750" y="490" width="32" height="32" fill="transparent"/>
  <rect x="756" y="499" width="14" height="16" stroke="#ff3b30" stroke-width="1.5" fill="none" rx="2"/>
  <line x1="756" y1="497" x2="770" y2="497" stroke="#ff3b30" stroke-width="1.5"/>

  <circle cx="266" cy="535" r="6" stroke="#1d1d1f" stroke-width="1.5" fill="none"/>
  <text x="280" y="540" font-family="Arial, sans-serif" font-size="13" fill="#6e6e73">28m 47s</text>

  <rect x="360" y="527" width="12" height="12" stroke="#1d1d1f" stroke-width="1.5" fill="none" rx="2"/>
  <text x="380" y="540" font-family="Arial, sans-serif" font-size="13" fill="#6e6e73">Jan 12, 2025, 3:15 PM</text>

  <text x="260" y="565" font-family="Arial, sans-serif" font-size="13" fill="#6e6e73">Reviewed new dashboard designs and navigation improvements.</text>
  <text x="260" y="585" font-family="Arial, sans-serif" font-size="13" fill="#6e6e73">Team approved final mockups for development...</text>
</svg>
